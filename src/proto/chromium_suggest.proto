// Chromium wire-compatible projection. See src/chromium/README.md and LICENSE.
syntax = "proto2";
package omnibox;
message FormattedString { optional string text = 1; }
message SuggestTemplateInfo {
  enum IconType {
    // Unspecified.
    ICON_TYPE_UNSPECIFIED = 0;
    // History clock icon.
    HISTORY = 1;
    // Search loop icon.
    SEARCH_LOOP = 2;
    // Search loop with sparkle icon.
    SEARCH_LOOP_WITH_SPARKLE = 3;
    // Trending icon.
    TRENDING = 4;
    // A sub arrow right icon.
    SUB_ARROW_RIGHT = 5;
    // A globe with a search loop icon, typically used for deep search.
    // Icon: Google Symbols:travel_explore
    GLOBE_WITH_SEARCH_LOOP = 6;
    // Banana icon, typically used for nano banana suggestions.
    // Uses the banana emoji.
    BANANA = 7;
    // Indicates the client should use the favicon from the page the suggestion
    // is from.
    FAVICON = 8;
    // Notes spark icon, used for AIM More Threads suggestions.
    // Icon: Google Symbols:notes_spark
    NOTES_SPARK = 9;
    // Draft spark icon, typically used for AIM canvas suggestions.
    // Icon: Google Symbols:draft_spark
    DRAFT_SPARK = 10;
    // A light bulb icon, used for the Brainstorm suggestions.
    // Icon: Google Symbols:lightbulb
    LIGHTBULB = 11;
    // Attach file icon, used in suggestions that ask the user to attach a file.
    // Icon: Google Symbols:attach_file
    ATTACH_FILE = 12;
    // School icon, used in EDU suggestions.
    // Icon: Google Symbols:school
    SCHOOL = 13;
    // Ink pen icon, used for writing suggestions.
    // Icon: Google Symbols:ink_pen
    INK_PEN = 14;
    // Tab icon, used for "Ask about tabs" suggestions.
    // Icon: Google Symbols:tab
    TAB = 15;
    // Photo spark icon, used for create image suggestions.
    // Icon: Google Symbols:photo_spark
    PHOTO_SPARK = 16;
    // Bolt icon, may be used for brainstorm suggestions.
    // Icon: Google Symbols:bolt
    BOLT = 17;
    // Image create icon, used for create image suggestions.
    // Icon: Luminous Symbols:image_create
    IMAGE_CREATE = 18;
    // Prompt suggestion icon, used for prompt suggestions.
    // Icon: Google Symbols:prompt_suggestion
    PROMPT_SUGGESTION = 19;
  }
  optional int32 style = 1;
  optional IconType type_icon = 2;
  optional FormattedString primary_text = 3;
  optional FormattedString secondary_text = 4;
  message Image { optional string url = 1; optional string dominant_color = 2; }
  optional Image image = 5;
}
